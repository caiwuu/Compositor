name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the DMG as a GitHub release once the app builds and launches
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
      build: ${{ steps.package.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # No Developer ID on the runner: signed ad hoc, which Apple silicon needs to run the app at all. Without the
      # hardened runtime: it only allows libraries from the app's own team, and ad hoc signatures have none, so the
      # app would be stopped at launch for loading its embedded Sparkle.
      - name: Build Release
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          ENABLE_HARDENED_RUNTIME=NO

      # Syncs the string catalog with what the compiler extracted, so text added without a Simplified Chinese
      # translation, or no longer used, is listed here. The synced catalog is uploaded to copy back into the project.
      - name: Check translations
        run: |
          cp Compositor/Localizable.xcstrings Localizable.xcstrings
          find DerivedData/Build/Intermediates.noindex -path '*arm64*' -name '*.stringsdata' -print0 \
            | xargs -0 xcrun xcstringstool sync Localizable.xcstrings --stringsdata
          python3 - <<'EOF'
          import json
          strings = json.load(open('Localizable.xcstrings'))['strings']
          untranslated = [key for key, entry in strings.items()
                          if entry.get('shouldTranslate', True) and entry.get('extractionState') != 'stale'
                          and 'zh-Hans' not in entry.get('localizations', {})]
          stale = [key for key, entry in strings.items() if entry.get('extractionState') == 'stale']
          for key in untranslated:
              print(f'::warning title=Untranslated::{key}')
          for key in stale:
              print(f'::notice title=No longer used::{key}')
          print(f'{len(strings)} strings, {len(untranslated)} without a zh-Hans translation, {len(stale)} no longer used.')
          EOF

      - name: Upload string catalog
        uses: actions/upload-artifact@v7
        with:
          name: Localizable.xcstrings
          path: Localizable.xcstrings
          retention-days: 14

      - name: Package
        id: package
        run: |
          APP=DerivedData/Build/Products/Release/Compositor.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          if codesign -dv "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "The app is signed with the hardened runtime; it won't load Sparkle on a Mac with library validation."
            exit 1
          fi
          ditto -c -k --keepParent "$APP" Compositor.zip
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" >> "$GITHUB_OUTPUT"
          echo "build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" >> "$GITHUB_OUTPUT"

      # The app beside a link to Applications, so it installs by dragging one onto the other.
      - name: Make disk image
        run: |
          mkdir dmg
          ditto DerivedData/Build/Products/Release/Compositor.app dmg/Compositor.app
          ln -s /Applications dmg/Applications
          # hdiutil on a runner now and then finds the volume busy; another try gets past it.
          for attempt in 1 2 3; do
            hdiutil create -volname Compositor -srcfolder dmg -fs HFS+ -format UDZO -ov Compositor.dmg && break
            sleep 5
          done
          hdiutil verify Compositor.dmg

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Compositor
          path: Compositor.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          name: Compositor.dmg
          path: Compositor.dmg
          retention-days: 14
          if-no-files-found: error

  # The build targets macOS 15, but the runner above is macOS 26: launching on Sequoia catches anything
  # that links against a newer system and only fails there.
  launch-on-sequoia:
    name: launch on macOS 15
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Download app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Compositor
          ditto -x -k Compositor.zip .

      - name: Launch and stay running
        run: |
          ./Compositor.app/Contents/MacOS/Compositor > launch.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Compositor exited during launch:"
            cat launch.log
            exit 1
          fi
          kill "$pid"
          echo "Compositor stayed running for 20 seconds on $(sw_vers -productVersion)."

  release:
    name: release
    needs: [build, launch-on-sequoia]
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Compositor.dmg

      # Tagged with the app's version; built again at the same version, the run number tells the releases apart.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo ${{ github.repository }} > /dev/null 2>&1; then
            tag="v$VERSION-${{ github.run_number }}"
          fi
          dmg="Compositor-${tag#v}.dmg"
          mv Compositor.dmg "$dmg"
          cat > notes.md <<NOTES
          Compositor $VERSION (build $BUILD), for macOS 15 Sequoia and later.

          The app is signed ad hoc, not with a Developer ID, so macOS stops it the first time. After dragging it to
          Applications, either Control-click it and choose Open, or run:

              xattr -cr /Applications/Compositor.app
          NOTES
          gh release create "$tag" "$dmg" --repo ${{ github.repository }} --target ${{ github.sha }} \
            --title "Compositor $VERSION" --notes-file notes.md --generate-notes
